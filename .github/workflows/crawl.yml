name: Crawl and merge catalog
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'مصادر محددة (مثل ml,aq) أو اتركه فارغًا', required: false }
      pages: { description: 'عدد صفحات القائمة لكل مصدر', required: false, default: '3' }
      cap: { description: 'حد صفحات التفاصيل في التشغيل', required: false, default: '100' }
  schedule:
    - cron: '17 */6 * * *'   # كل 6 ساعات
concurrency: { group: crawl, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Crawl
        run: node scripts/crawl.js
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
          IDS: ${{ inputs.ids }}
          PAGES: ${{ inputs.pages || 3 }}
          DETAIL_CAP: ${{ inputs.cap || 100 }}
      - name: Merge
        run: node scripts/merge.js
      - name: Commit data
        run: |
          git config user.name "catalog-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Update catalog $(date -u +%F\ %H:%M)"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main
